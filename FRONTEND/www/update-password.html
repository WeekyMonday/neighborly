<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update password · Neighborly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151a;
    --slate: #6b7280;
    --slate-soft: #9498a3;
    --cloud: #f4f5f9;
    --paper: #ffffff;
    --border-soft: #e6e7ec;
    --echo-violet: #6d5cf0;
    --echo-violet-hover: #5a4ad9;
    --danger: #e0405a;
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--cloud);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .display-face { font-family: 'Fraunces', Georgia, serif; }
  a { color: inherit; text-decoration: none; }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background-color: var(--paper);
    border-radius: 20px;
    padding: 24px 32px 32px 32px;
    box-shadow: 0 20px 50px rgba(20, 21, 26, 0.08);
    text-align: center;
    position: relative;
  }

  .auth-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background-color: rgba(109, 92, 240, 0.12);
    color: var(--echo-violet);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px auto;
  }
  .auth-icon svg { width: 26px; height: 26px; }

  .auth-card h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 22px;
    margin-bottom: 8px;
  }

  .auth-card .auth-desc {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.55;
    max-width: 300px;
    margin: 0 auto 26px auto;
  }

  form { text-align: left; }

  .field-group { margin-bottom: 16px; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .field-input-wrap { position: relative; }

  .field-input {
    width: 100%;
    height: 46px;
    border: 1.5px solid var(--border-soft);
    border-radius: 12px;
    padding: 0 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background-color: var(--cloud);
    outline: none;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), background-color 0.15s var(--ease);
  }
  .field-input::placeholder { color: var(--slate-soft); }
  .field-input:focus {
    border-color: var(--echo-violet);
    background-color: var(--paper);
    box-shadow: 0 0 0 4px rgba(109, 92, 240, 0.14);
  }
  .field-input.has-error { border-color: var(--danger); }

  .field-error-text {
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    display: none;
  }
  .field-error-text.show { display: block; }

  .password-toggle-btn {
    position: absolute;
    right: 6px;
    top: 6px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--slate);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .password-toggle-btn:hover { background-color: var(--border-soft); color: var(--ink); }
  .password-toggle-btn svg { width: 18px; height: 18px; }

  .auth-submit-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 999px;
    background-color: var(--echo-violet);
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), transform 0.15s var(--ease);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .auth-submit-btn:hover { background-color: var(--echo-violet-hover); }
  .auth-submit-btn:active { transform: scale(0.98); }
  .auth-submit-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #ffffff;
    display: none;
    animation: spin 0.7s linear infinite;
  }
  .auth-submit-btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .form-banner {
    display: none;
    align-items: flex-start;
    gap: 10px;
    background-color: rgba(224, 64, 90, 0.08);
    border: 1px solid rgba(224, 64, 90, 0.25);
    color: var(--danger);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 18px;
    text-align: left;
  }
  .form-banner.show { display: flex; }
  .form-banner.success {
    background-color: rgba(35, 165, 90, 0.08);
    border-color: rgba(35, 165, 90, 0.25);
    color: #1f9c53;
  }
  .form-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  .error-page {
    display: none;
    text-align: center;
  }
  .error-page.show { display: block; }
  .error-page .auth-icon { background-color: rgba(224, 64, 90, 0.12); color: var(--danger); }

  @media (max-width: 420px) {
    .auth-card { padding: 20px 22px 26px 22px; }
  }
</style>
<link rel="stylesheet" href="css/artificium-theme.css?v=12">
<link rel="stylesheet" href="css/auth-pages.css?v=1">
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="js/firebase.js"></script>
</head>
<body>
  <div class="auth-card">
    <a class="auth-brand" href="/" aria-label="Neighborly home"><span class="brand-mark" aria-hidden="true">n</span><span>neighborly</span></a>

    <div class="form-banner" id="form-banner" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span id="form-banner-text">Something went wrong. Try again.</span>
    </div>

    <!-- Reset Password Form -->
    <div id="form-section">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15.5" r="1.5"></circle></svg>
      </div>
      <h1 class="display-face">Set a new password</h1>
      <p class="auth-desc">Make it something you haven't used before.</p>

      <form id="reset-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="new-password">New password</label>
          <div class="field-input-wrap">
            <input class="field-input" type="password" id="new-password" placeholder="At least 8 characters" autocomplete="new-password" required style="padding-right: 44px;">
            <button type="button" class="password-toggle-btn" id="toggle-password-1" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <p class="field-error-text" id="new-password-error">Password must be at least 8 characters.</p>
        </div>

        <div class="field-group">
          <label class="field-label" for="confirm-password">Confirm password</label>
          <div class="field-input-wrap">
            <input class="field-input" type="password" id="confirm-password" placeholder="Re-enter your password" autocomplete="new-password" required style="padding-right: 44px;">
            <button type="button" class="password-toggle-btn" id="toggle-password-2" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <p class="field-error-text" id="confirm-password-error">Passwords don't match.</p>
        </div>

        <button type="submit" class="auth-submit-btn" id="reset-btn">
          <span class="spinner"></span>
          <span class="btn-label">Reset password</span>
        </button>
      </form>
    </div>

    <!-- Error Section (shown if link is invalid) -->
    <div class="error-page" id="error-section">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
      </div>
      <h1 class="display-face">Link expired</h1>
      <p class="auth-desc" id="error-message">This password reset link is no longer valid. Please request a new one.</p>
      <a href="forgot-password.html" class="auth-submit-btn" style="text-decoration: none; background-color: var(--echo-violet);">
        Request new link
      </a>
    </div>

  </div>

  <script>
    // Firebase sends password-reset links containing an out-of-band code.
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const actionCode = params.get('oobCode');

    async function initPage() {
      if (mode !== 'resetPassword' || !actionCode) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('error-section').classList.add('show');
        document.getElementById('error-message').textContent = 'Invalid reset link. Please request a new one.';
        return;
      }

      try {
        await window.neighborlyAuth.verifyPasswordResetCode(actionCode);
      } catch (error) {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('error-section').classList.add('show');
        document.getElementById('error-message').textContent = error.message || 'This link has expired. Please request a new one.';
      }
    }

    // Initialize on page load
    initPage();

    function setFieldError(id, show) {
      const input = document.getElementById(id);
      if (input) input.classList.toggle('has-error', show);
      const err = document.getElementById(id + '-error');
      if (err) err.classList.toggle('show', show);
    }

    function showBanner(text, success) {
      const banner = document.getElementById('form-banner');
      document.getElementById('form-banner-text').textContent = text;
      banner.classList.toggle('success', !!success);
      banner.classList.add('show');
    }

    // Password visibility toggles
    [1, 2].forEach(n => {
      const input = document.getElementById(n === 1 ? 'new-password' : 'confirm-password');
      const toggle = document.getElementById('toggle-password-' + n);
      toggle.addEventListener('click', () => {
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        toggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });

    // Handle form submission
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      const pwValid = pw.length >= 8;
      const matchValid = pw === confirm && confirm.length > 0;

      setFieldError('new-password', !pwValid);
      setFieldError('confirm-password', pwValid && !matchValid);
      if (!pwValid || !matchValid) return;

      const btn = document.getElementById('reset-btn');
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        await window.neighborlyAuth.confirmPasswordReset(actionCode, pw);
      } catch (error) {
        showBanner(error.message || "Couldn't update your password. Try again.");
        btn.classList.remove('loading');
        btn.disabled = false;
        return;
      }

      btn.classList.remove('loading');
      btn.disabled = false;

      showBanner("Password updated! Redirecting you to log in...", true);
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    });
  </script>

</body>
</html>
