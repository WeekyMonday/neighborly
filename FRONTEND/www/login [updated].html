<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Echo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14151a;
    --slate: #6b7280;
    --slate-soft: #9498a3;
    --cloud: #f4f5f9;
    --paper: #ffffff;
    --border-soft: #e6e7ec;
    --echo-violet: #6d5cf0;
    --echo-violet-hover: #5a4ad9;
    --danger: #e0405a;
    --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--cloud);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .display-face { font-family: 'Fraunces', Georgia, serif; }
  a { color: inherit; text-decoration: none; }

  .auth-card {
    width: 100%;
    max-width: 400px;
    background-color: var(--paper);
    border-radius: 20px;
    padding: 36px 32px 32px 32px;
    box-shadow: 0 20px 50px rgba(20, 21, 26, 0.08);
    text-align: center;
  }

  .auth-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background-color: rgba(109, 92, 240, 0.12);
    color: var(--echo-violet);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px auto;
  }
  .auth-icon svg { width: 26px; height: 26px; }

  .auth-card h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 24px;
    margin-bottom: 8px;
  }

  .auth-card .auth-desc {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.55;
    max-width: 300px;
    margin: 0 auto 28px auto;
  }

  form { text-align: left; }

  .field-group { margin-bottom: 16px; }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }

  .field-input-wrap { position: relative; }

  .field-input {
    width: 100%;
    height: 46px;
    border: 1.5px solid var(--border-soft);
    border-radius: 12px;
    padding: 0 14px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background-color: var(--cloud);
    outline: none;
    transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), background-color 0.15s var(--ease);
  }
  .field-input::placeholder { color: var(--slate-soft); }
  .field-input:focus {
    border-color: var(--echo-violet);
    background-color: var(--paper);
    box-shadow: 0 0 0 4px rgba(109, 92, 240, 0.14);
  }
  .field-input.has-error { border-color: var(--danger); }
  .field-input.shake, .auth-card.shake { animation: auth-shake 0.36s ease-in-out; }
  @keyframes auth-shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .field-input.shake, .auth-card.shake { animation: none; } }

  .field-error-text {
    font-size: 12px;
    color: var(--danger);
    margin-top: 6px;
    display: none;
  }
  .field-error-text.show { display: block; }

  .password-toggle-btn {
    position: absolute;
    right: 6px;
    top: 6px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: none;
    background: none;
    color: var(--slate);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .password-toggle-btn:hover { background-color: var(--border-soft); color: var(--ink); }
  .password-toggle-btn svg { width: 18px; height: 18px; }

  .field-row-between {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    margin-bottom: 22px;
  }
  .forgot-link { font-size: 12px; font-weight: 700; color: var(--echo-violet); }
  .forgot-link:hover { text-decoration: underline; }

  .auth-submit-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 999px;
    background-color: var(--echo-violet);
    color: #ffffff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.15s var(--ease), transform 0.15s var(--ease);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .auth-submit-btn:hover { background-color: var(--echo-violet-hover); }
  .auth-submit-btn:active { transform: scale(0.98); }
  .auth-submit-btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #ffffff;
    display: none;
    animation: spin 0.7s linear infinite;
  }
  .auth-submit-btn.loading .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .auth-form-footnote {
    margin-top: 22px;
    font-size: 13px;
    color: var(--slate);
    text-align: center;
  }
  .auth-form-footnote a { color: var(--echo-violet); font-weight: 700; }
  .auth-form-footnote a:hover { text-decoration: underline; }

  .form-banner {
    display: none;
    align-items: flex-start;
    gap: 10px;
    background-color: rgba(224, 64, 90, 0.08);
    border: 1px solid rgba(224, 64, 90, 0.25);
    color: var(--danger);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 18px;
    text-align: left;
  }
  .form-banner.show { display: flex; }
  .form-banner svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }

  @media (max-width: 420px) {
    .auth-card { padding: 28px 22px 26px 22px; }
  }
</style>
<link rel="stylesheet" href="css/artificium-theme.css?v=12">
</head>
<body>
  <script src="js/neighborly-loader.js"></script>

  <div class="auth-card">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>

    <h1 class="display-face">Welcome back</h1>
    <p class="auth-desc">Log in to keep up with what's happening on campus.</p>

    <div class="form-banner" id="form-banner" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span id="form-banner-text">Something went wrong. Try again.</span>
    </div>

    <form id="login-form" novalidate>
      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <div class="field-input-wrap">
          <input class="field-input" type="email" id="email" name="email" placeholder="you@campus.edu" autocomplete="email" required>
        </div>
        <p class="field-error-text" id="email-error">Enter a valid email address.</p>
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="field-input-wrap">
          <input class="field-input" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right: 44px;">
          <button type="button" class="password-toggle-btn" id="toggle-password" title="Show password" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <p class="field-error-text" id="password-error">Enter your password.</p>
      </div>

      <div class="field-row-between">
        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="auth-submit-btn" id="submit-btn">
        <span class="spinner"></span>
        <span class="btn-label">Log in</span>
      </button>
    </form>

    <p class="auth-form-footnote">New to Echo? <a href="register.html">Create an account</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script>
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('toggle-password');
    pwToggle.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      pwToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
    });

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const banner = document.getElementById('form-banner');
    const bannerText = document.getElementById('form-banner-text');

    function setFieldError(id, show) {
      const input = document.getElementById(id);
      input.classList.toggle('has-error', show);
      if (show) shakeElement(input);
      const err = document.getElementById(id + '-error');
      if (err) err.classList.toggle('show', show);
    }

    function shakeElement(element) {
      element.classList.remove('shake');
      void element.offsetWidth;
      element.classList.add('shake');
      element.addEventListener('animationend', () => element.classList.remove('shake'), { once: true });
    }

    function isValidEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      banner.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const emailValid = isValidEmail(email);
      const passwordValid = password.length > 0;

      setFieldError('email', !emailValid);
      setFieldError('password', !passwordValid);
      if (!emailValid || !passwordValid) {
        document.querySelector('.field-input.has-error')?.focus();
        return;
      }

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const credential = await window.neighborlyAuth.signInWithEmailAndPassword(email, password);
        const user = credential.user;
        await user.reload();
        if (!user.emailVerified) {
          let verificationSent = false;
          try {
            await user.sendEmailVerification();
            verificationSent = true;
          } catch (verificationError) {
            console.warn('Could not resend email verification:', verificationError);
          }
          await window.neighborlyAuth.signOut();
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          bannerText.textContent = verificationSent
            ? `Your email is not verified yet. We sent another verification link to ${email}. Open it, then log in again.`
            : `Your email is not verified yet. Please try logging in again later to resend the verification link.`;
          banner.classList.add('show');
          return;
        }

        const savedProfile = JSON.parse(localStorage.getItem(`neighborly_profile_${user.uid}`) || 'null');
        const displayName = user.displayName || savedProfile?.name || user.email || email;
        localStorage.setItem('neighborly_session', JSON.stringify({
          uid: user.uid,
          email: user.email || email,
          emailVerified: true,
          name: displayName,
          handle: savedProfile?.handle || (user.email || email).split('@')[0],
          phone: savedProfile?.phone || ''
        }));

        window.location.href = 'Neighborly.html';
      } catch (error) {
        shakeElement(document.querySelector('.auth-card'));
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
        bannerText.textContent = error.message || 'Something went wrong. Try again.';
        banner.classList.add('show');
      }
    });
  </script>

</body>
</html>
