# Render.com Blueprint — deploys Neighborly as a public website.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: neighborly
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: INVITE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # --- Durable storage (friends, DMs, profiles) -------------------------
      # Run BACKEND/supabase-schema.sql once in the Supabase SQL Editor, then
      # paste your project's values here. Set both to "Sync: false" and fill
      # them in, or leave them unset to fall back to in-memory storage.
      # Never commit the service_role key — it bypasses all RLS.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
